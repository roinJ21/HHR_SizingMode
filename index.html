<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Helmet Heroes - Adjustable Game Viewport</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            500: '#00b012',
                            600: '#00900f',
                            700: '#00700b',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body {
            transition: background-color 0.3s ease, color 0.3s ease;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }

        /* Fluid game container styling */
        .game-viewport {
            transition: width 0.25s ease-out, height 0.25s ease-out, max-width 0.25s ease-out;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        }

        /* Custom range slider styling */
        input[type=range] {
            accent-color: #00b012;
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 dark:bg-slate-950 dark:text-slate-100 min-h-screen flex flex-col m-0 p-0 overflow-x-hidden">

    <!-- Top Header Bar -->
    <header class="w-full bg-slate-800/80 dark:bg-slate-900/90 border-b border-slate-700/80 backdrop-blur-md px-4 py-3 flex items-center justify-between gap-4 sticky top-0 z-50">
        
        <!-- Left: Brand / Logo Title -->
        <div class="flex items-center gap-3">
            <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-brand-700 via-brand-500 to-emerald-300 flex items-center justify-center font-black text-white text-lg shadow-lg shadow-brand-500/20">
                HH
            </div>
            <div>
                <h1 class="text-base font-bold leading-none tracking-tight text-slate-900 dark:text-white">Helmet Heroes</h1>
                <span class="text-xs text-brand-500 font-medium">Viewport Studio</span>
            </div>
        </div>

        <!-- Center: Minimal Nav (ONLY Discord) -->
        <nav class="flex items-center">
            <a href="https://discord.gg/AvTxPCMJdd" target="_blank" rel="noopener noreferrer" 
               class="inline-flex items-center gap-2 bg-[#5865F2] hover:bg-[#4752C4] text-white text-sm font-semibold px-4 py-2 rounded-lg transition-all shadow-md shadow-indigo-500/20 hover:scale-105 active:scale-95">
                <svg class="w-5 h-5 fill-current" viewBox="0 0 24 24">
                    <path d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028c.462-.63.874-1.295 1.226-1.994.021-.041.001-.09-.041-.106a13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128 10.2 10.2 0 0 0 .372-.292.074.074 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.061 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.299 12.299 0 0 1-1.873.892.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.028zM8.02 15.33c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.956-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.956 2.418-2.157 2.418zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.946 2.418-2.157 2.418z"/>
                </svg>
                <span>Join Discord</span>
            </a>
        </nav>

        <!-- Right: Theme Mode Toggle (Light / Dark) -->
        <div class="flex items-center gap-2">
            <button id="themeToggleBtn" onclick="toggleTheme()" 
                    class="p-2.5 rounded-xl bg-slate-700/60 dark:bg-slate-800 text-slate-200 hover:text-white hover:bg-slate-700 border border-slate-600/50 transition-all flex items-center justify-center">
                <!-- Sun Icon (Light Mode) -->
                <svg id="sunIcon" class="w-5 h-5 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path>
                </svg>
                <!-- Moon Icon (Dark Mode) -->
                <svg id="moonIcon" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path>
                </svg>
            </button>
        </div>
    </header>

    <!-- Toolbar Controls for Viewport Dimensions -->
    <section class="w-full bg-slate-800 dark:bg-slate-900 border-b border-slate-700/80 px-4 py-3 flex flex-wrap items-center justify-between gap-4 text-xs md:text-sm">
        
        <!-- Mode & Presets -->
        <div class="flex flex-wrap items-center gap-2">
            <span class="text-slate-400 font-semibold uppercase tracking-wider text-[11px]">Sizing Mode:</span>
            
            <button onclick="setFullEdgeToEdge()" id="btnFullEdge"
                    class="bg-brand-600 hover:bg-brand-500 text-white font-medium px-3 py-1.5 rounded-lg transition-all shadow-sm">
                100% Full Edge
            </button>
            <button onclick="setPreset('16:9')" 
                    class="bg-slate-700 hover:bg-slate-600 text-slate-200 font-medium px-3 py-1.5 rounded-lg transition-all">
                16:9 HD
            </button>
            <button onclick="setPreset('21:9')" 
                    class="bg-slate-700 hover:bg-slate-600 text-slate-200 font-medium px-3 py-1.5 rounded-lg transition-all">
                21:9 Ultrawide
            </button>
            <button onclick="setPreset('4:3')" 
                    class="bg-slate-700 hover:bg-slate-600 text-slate-200 font-medium px-3 py-1.5 rounded-lg transition-all">
                4:3 Classic
            </button>
            <button onclick="toggleFullscreen()" 
                    class="bg-indigo-600 hover:bg-indigo-500 text-white font-medium px-3 py-1.5 rounded-lg transition-all flex items-center gap-1.5">
                <svg class="w-4 h-4 fill-current" viewBox="0 0 24 24">
                    <path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/>
                </svg>
                <span>Fullscreen</span>
            </button>
        </div>

        <!-- Custom Manual Sliders -->
        <div class="flex flex-wrap items-center gap-6">
            <!-- Width Slider -->
            <div class="flex items-center gap-2">
                <label for="widthRange" class="text-slate-400 font-semibold">Width:</label>
                <input type="range" id="widthRange" min="300" max="3840" step="10" value="1920" 
                       class="w-32 md:w-48 cursor-pointer" oninput="onCustomSliderChange()">
                <span id="widthDisplay" class="font-mono bg-slate-950 px-2 py-1 rounded border border-slate-800 text-brand-400 font-bold w-16 text-center">100%</span>
            </div>

            <!-- Height Slider -->
            <div class="flex items-center gap-2">
                <label for="heightRange" class="text-slate-400 font-semibold">Height:</label>
                <input type="range" id="heightRange" min="300" max="2160" step="10" value="850" 
                       class="w-32 md:w-48 cursor-pointer" oninput="onCustomSliderChange()">
                <span id="heightDisplay" class="font-mono bg-slate-950 px-2 py-1 rounded border border-slate-800 text-brand-400 font-bold w-16 text-center">850px</span>
            </div>
        </div>
    </section>

    <!-- Unconstrained Dynamic Game Viewport Outer Area -->
    <main class="flex-1 w-full flex justify-center items-start bg-slate-950 p-0 m-0 overflow-hidden relative">
        
        <!-- Dynamic Game Container -->
        <div id="gameViewport" class="game-viewport w-full h-[85vh] bg-black relative flex items-center justify-center overflow-hidden">
            <!-- Embedded Game Frame -->
            <iframe 
                id="gameIFrame" 
                src="https://itch.io/embed-upload/16918919?color=00b012" 
                class="w-full h-full border-0 outline-none"
                allowfullscreen="true" 
                webkitallowfullscreen="true" 
                mozallowfullscreen="true">
            </iframe>
        </div>

    </main>

    <script>
        // DOM Elements
        const viewport = document.getElementById('gameViewport');
        const iframe = document.getElementById('gameIFrame');
        const widthRange = document.getElementById('widthRange');
        const heightRange = document.getElementById('heightRange');
        const widthDisplay = document.getElementById('widthDisplay');
        const heightDisplay = document.getElementById('heightDisplay');
        const sunIcon = document.getElementById('sunIcon');
        const moonIcon = document.getElementById('moonIcon');

        let isEdgeToEdge = true;

        // Theme Toggle Functionality
        function toggleTheme() {
            const htmlTag = document.documentElement;
            if (htmlTag.classList.contains('dark')) {
                htmlTag.classList.remove('dark');
                document.body.classList.remove('bg-slate-950', 'text-slate-100');
                document.body.classList.add('bg-slate-100', 'text-slate-900');
                sunIcon.classList.remove('hidden');
                moonIcon.classList.add('hidden');
            } else {
                htmlTag.classList.add('dark');
                document.body.classList.remove('bg-slate-100', 'text-slate-900');
                document.body.classList.add('bg-slate-950', 'text-slate-100');
                sunIcon.classList.add('hidden');
                moonIcon.classList.remove('hidden');
            }
        }

        // Apply 100% Edge-to-Edge width
        function setFullEdgeToEdge() {
            isEdgeToEdge = true;
            viewport.style.width = '100%';
            viewport.style.maxWidth = 'none';
            widthDisplay.textContent = '100%';
            widthRange.value = window.innerWidth;
        }

        // Apply Preset aspect ratio or resolution
        function setPreset(aspect) {
            isEdgeToEdge = false;
            const screenWidth = window.innerWidth;
            let targetWidth, targetHeight;

            if (aspect === '16:9') {
                targetWidth = Math.min(screenWidth, 1600);
                targetHeight = Math.round(targetWidth * (9 / 16));
            } else if (aspect === '21:9') {
                targetWidth = Math.min(screenWidth, 1920);
                targetHeight = Math.round(targetWidth * (9 / 21));
            } else if (aspect === '4:3') {
                targetWidth = Math.min(screenWidth, 1200);
                targetHeight = Math.round(targetWidth * (3 / 4));
            }

            applyCustomDimensions(targetWidth, targetHeight);
        }

        // Apply custom slider width/height
        function onCustomSliderChange() {
            isEdgeToEdge = false;
            const w = parseInt(widthRange.value, 10);
            const h = parseInt(heightRange.value, 10);
            applyCustomDimensions(w, h);
        }

        function applyCustomDimensions(w, h) {
            viewport.style.width = `${w}px`;
            viewport.style.maxWidth = '100%';
            viewport.style.height = `${h}px`;

            widthDisplay.textContent = `${w}px`;
            heightDisplay.textContent = `${h}px`;

            widthRange.value = w;
            heightRange.value = h;
        }

        // Fullscreen Toggle
        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                if (viewport.requestFullscreen) {
                    viewport.requestFullscreen();
                } else if (viewport.webkitRequestFullscreen) {
                    viewport.webkitRequestFullscreen();
                }
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
            }
        }

        // Handle window resize dynamically
        window.addEventListener('resize', () => {
            if (isEdgeToEdge) {
                widthRange.value = window.innerWidth;
            }
        });

        // Initial setup on load
        window.onload = function() {
            setFullEdgeToEdge();
        };
    </script>
</body>
</html>
