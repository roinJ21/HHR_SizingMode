<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Helmet Heroes - Adjustable Game Viewport Studio</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        // Custom Bright Neon Orange Theme Palette for Pitch Black Dark Mode
                        orange: {
                            500: '#ff6600',
                            600: '#ea580c',
                            700: '#c2410c',
                            glow: 'rgba(255, 102, 0, 0.4)'
                        },
                        // Soft Sky Blue Theme Palette for Light Mode
                        skytheme: {
                            50: '#f0f8ff',
                            100: '#e0f2fe',
                            200: '#bae6fd',
                            500: '#0284c7',
                            600: '#0369a1',
                            text: '#0f172a'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        /* Smooth transitions for theme swapping */
        body {
            transition: background-color 0.3s ease, color 0.3s ease;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            user-select: none;
        }

        /* Pure Light Mode styling setup */
        html:not(.dark) body {
            background-color: #f0f8ff; /* Icy blue-white */
            color: #0f172a;
        }

        /* Pitch Black Dark Mode styling setup */
        html.dark body {
            background-color: #000000; /* Pure pitch black */
            color: #f8fafc;
        }

        /* Viewport Frame Box styling */
        .game-viewport {
            transition: box-shadow 0.3s ease, width 0.1s ease, height 0.1s ease;
            box-sizing: border-box;
            position: relative;
        }

        html:not(.dark) .game-viewport {
            box-shadow: 0 15px 35px rgba(2, 132, 199, 0.15), 0 0 0 1px rgba(186, 230, 253, 0.8);
        }

        html.dark .game-viewport {
            box-shadow: 0 0 25px rgba(255, 102, 0, 0.25), 0 0 0 1px rgba(255, 102, 0, 0.3);
        }

        /* Custom Drag Handles Styling */
        .drag-handle {
            position: absolute;
            z-index: 40;
            transition: background-color 0.2s, opacity 0.2s;
        }

        /* Edge Drag Handle Highlights */
        html:not(.dark) .drag-handle {
            background-color: rgba(2, 132, 199, 0.4);
        }
        html:not(.dark) .drag-handle:hover, html:not(.dark) .drag-handle.dragging {
            background-color: #0284c7;
        }

        html.dark .drag-handle {
            background-color: rgba(255, 102, 0, 0.4);
        }
        html.dark .drag-handle:hover, html.dark .drag-handle.dragging {
            background-color: #ff6600;
            box-shadow: 0 0 12px #ff6600;
        }

        /* Handle Dimensions for Top, Bottom, Left, Right and Corners */
        .handle-top { top: -4px; left: 0; right: 0; height: 8px; cursor: ns-resize; }
        .handle-bottom { bottom: -4px; left: 0; right: 0; height: 8px; cursor: ns-resize; }
        .handle-left { top: 0; bottom: 0; left: -4px; width: 8px; cursor: ew-resize; }
        .handle-right { top: 0; bottom: 0; right: -4px; width: 8px; cursor: ew-resize; }
        
        /* Corner handle */
        .handle-corner-br {
            bottom: -8px;
            right: -8px;
            width: 16px;
            height: 16px;
            border-radius: 4px;
            cursor: nwse-resize;
            z-index: 45;
        }

        /* Custom range sliders */
        html:not(.dark) input[type=range] {
            accent-color: #0284c7;
        }
        html.dark input[type=range] {
            accent-color: #ff6600;
        }

        /* Preset active button state */
        .preset-btn.active {
            font-weight: 700;
        }
        html:not(.dark) .preset-btn.active {
            background-color: #0284c7;
            color: #ffffff;
            box-shadow: 0 2px 8px rgba(2, 132, 199, 0.3);
        }
        html.dark .preset-btn.active {
            background-color: #ff6600;
            color: #ffffff;
            box-shadow: 0 0 12px rgba(255, 102, 0, 0.5);
        }

        /* Disable iframe mouse interaction during dragging */
        .disable-pointer {
            pointer-events: none !important;
        }
    </style>
</head>
<body class="h-screen flex flex-col m-0 p-0 overflow-hidden">

    <header class="w-full bg-white/90 dark:bg-[#000000]/90 border-b border-skytheme-200 dark:border-orange-500/30 backdrop-blur-md px-4 py-3 flex items-center justify-between gap-4 shrink-0 transition-colors">
        
        <!-- Left: Brand / Title -->
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-skytheme-600 to-skytheme-500 dark:from-orange-700 dark:via-orange-500 dark:to-amber-400 flex items-center justify-center font-black text-white text-xl shadow-md dark:shadow-orange-500/30">
                HH
            </div>
            <div>
                <h1 class="text-base font-extrabold tracking-tight text-slate-900 dark:text-white flex items-center gap-2">
                    Helmet Heroes
                    <span class="text-[10px] uppercase font-bold tracking-wider px-2 py-0.5 rounded-full bg-skytheme-100 text-skytheme-600 dark:bg-orange-500/20 dark:text-orange-500 dark:border dark:border-orange-500/30">
                        Viewport Studio
                    </span>
                </h1>
                <p class="text-xs text-slate-500 dark:text-neutral-400">Custom Screen & Resolution Controller</p>
            </div>
        </div>

        <!-- Center: Discord Link Button -->
        <nav class="flex items-center">
            <a href="https://discord.gg/AvTxPCMJdd" target="_blank" rel="noopener noreferrer" 
               class="inline-flex items-center gap-2 bg-[#5865F2] hover:bg-[#4752C4] text-white text-sm font-semibold px-4 py-2 rounded-xl transition-all shadow-md shadow-indigo-500/20 hover:scale-105 active:scale-95">
                <svg class="w-5 h-5 fill-current" viewBox="0 0 24 24">
                    <path d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028c.462-.63.874-1.295 1.226-1.994.021-.041.001-.09-.041-.106a13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128 10.2 10.2 0 0 0 .372-.292.074.074 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.061 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.299 12.299 0 0 1-1.873.892.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.028zM8.02 15.33c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.956-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.956 2.418-2.157 2.418zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.946 2.418-2.157 2.418z"/>
                </svg>
                <span>Join Discord</span>
            </a>
        </nav>

        <!-- Right: Light / Dark Mode Toggle -->
        <div class="flex items-center gap-2">
            <button id="themeToggleBtn" onclick="toggleTheme()" aria-label="Toggle Theme"
                    class="p-2.5 rounded-xl bg-skytheme-100 hover:bg-skytheme-200 text-skytheme-600 dark:bg-[#000000] dark:hover:bg-[#1f1f1f] dark:text-orange-500 border border-skytheme-200 dark:border-orange-500/40 transition-all flex items-center justify-center shadow-sm">
                <!-- Sun Icon -->
                <svg id="sunIcon" class="w-5 h-5 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path>
                </svg>
                <!-- Moon Icon -->
                <svg id="moonIcon" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path>
                </svg>
            </button>
        </div>
    </header>

    <section class="w-full bg-white dark:bg-[#000000] border-b border-skytheme-200 dark:border-orange-500/20 px-4 py-3 flex flex-col gap-3 text-xs md:text-sm shrink-0 transition-colors shadow-sm">
        
        <!-- Row 1: Aspect Ratio Presets & Fullscreen Button -->
        <div class="flex flex-wrap items-center justify-between gap-3">
            <div class="flex flex-wrap items-center gap-2">
                <span class="text-slate-500 dark:text-neutral-400 font-bold uppercase tracking-wider text-[11px]">Presets:</span>
                
                <button onclick="setFullEdgeToEdge()" id="preset-100%" 
                        class="preset-btn active bg-skytheme-100 dark:bg-[#121212] hover:bg-skytheme-200 dark:hover:bg-neutral-800 text-slate-700 dark:text-neutral-200 font-semibold px-3 py-1.5 rounded-lg border border-skytheme-200 dark:border-neutral-800 transition-all">
                    100% Full Edge
                </button>
                <button onclick="setPreset('16:9')" id="preset-16:9" 
                        class="preset-btn bg-skytheme-100 dark:bg-[#121212] hover:bg-skytheme-200 dark:hover:bg-neutral-800 text-slate-700 dark:text-neutral-200 font-semibold px-3 py-1.5 rounded-lg border border-skytheme-200 dark:border-neutral-800 transition-all">
                    16:9 HD
                </button>
                <button onclick="setPreset('21:9')" id="preset-21:9" 
                        class="preset-btn bg-skytheme-100 dark:bg-[#121212] hover:bg-skytheme-200 dark:hover:bg-neutral-800 text-slate-700 dark:text-neutral-200 font-semibold px-3 py-1.5 rounded-lg border border-skytheme-200 dark:border-neutral-800 transition-all">
                    21:9 Ultrawide
                </button>
                <button onclick="setPreset('4:3')" id="preset-4:3" 
                        class="preset-btn bg-skytheme-100 dark:bg-[#121212] hover:bg-skytheme-200 dark:hover:bg-neutral-800 text-slate-700 dark:text-neutral-200 font-semibold px-3 py-1.5 rounded-lg border border-skytheme-200 dark:border-neutral-800 transition-all">
                    4:3 Classic
                </button>
                <button onclick="setPreset('9:16')" id="preset-9:16" 
                        class="preset-btn bg-skytheme-100 dark:bg-[#121212] hover:bg-skytheme-200 dark:hover:bg-neutral-800 text-slate-700 dark:text-neutral-200 font-semibold px-3 py-1.5 rounded-lg border border-skytheme-200 dark:border-neutral-800 transition-all">
                    9:16 Mobile
                </button>
                <button onclick="setPreset('1:1')" id="preset-1:1" 
                        class="preset-btn bg-skytheme-100 dark:bg-[#121212] hover:bg-skytheme-200 dark:hover:bg-neutral-800 text-slate-700 dark:text-neutral-200 font-semibold px-3 py-1.5 rounded-lg border border-skytheme-200 dark:border-neutral-800 transition-all">
                    1:1 Square
                </button>
            </div>

            <!-- Fullscreen trigger -->
            <button onclick="toggleFullscreen()" 
                    class="bg-skytheme-500 hover:bg-skytheme-600 dark:bg-orange-500 dark:hover:bg-orange-600 text-white font-bold px-4 py-1.5 rounded-xl transition-all shadow-md shadow-skytheme-500/20 dark:shadow-orange-500/30 flex items-center gap-2 active:scale-95">
                <svg class="w-4 h-4 fill-current" viewBox="0 0 24 24">
                    <path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/>
                </svg>
                <span>Fullscreen</span>
            </button>
        </div>

        <!-- Row 2: Manual Controls (Width, Height, Top/Bottom Margins, Zoom Scale) -->
        <div class="grid grid-cols-2 md:grid-cols-5 gap-4 pt-2 border-t border-skytheme-100 dark:border-neutral-900 items-center">
            
            <!-- Width Slider -->
            <div class="flex flex-col gap-1">
                <div class="flex justify-between items-center font-bold text-xs">
                    <label for="widthRange" class="text-slate-600 dark:text-neutral-300">Width</label>
                    <span id="widthDisplay" class="font-mono text-skytheme-600 dark:text-orange-500 font-bold">100%</span>
                </div>
                <input type="range" id="widthRange" min="320" max="3840" step="10" value="1920" 
                       class="w-full cursor-pointer" oninput="onSliderInput()">
            </div>

            <!-- Height Slider -->
            <div class="flex flex-col gap-1">
                <div class="flex justify-between items-center font-bold text-xs">
                    <label for="heightRange" class="text-slate-600 dark:text-neutral-300">Height</label>
                    <span id="heightDisplay" class="font-mono text-skytheme-600 dark:text-orange-500 font-bold">100%</span>
                </div>
                <input type="range" id="heightRange" min="300" max="2160" step="10" value="800" 
                       class="w-full cursor-pointer" oninput="onSliderInput()">
            </div>

            <!-- Top Margin Slider -->
            <div class="flex flex-col gap-1">
                <div class="flex justify-between items-center font-bold text-xs">
                    <label for="marginTopRange" class="text-slate-600 dark:text-neutral-300">Top Margin</label>
                    <span id="marginTopDisplay" class="font-mono text-skytheme-600 dark:text-orange-500 font-bold">0px</span>
                </div>
                <input type="range" id="marginTopRange" min="0" max="200" step="5" value="0" 
                       class="w-full cursor-pointer" oninput="onMarginInput()">
            </div>

            <!-- Bottom Margin Slider -->
            <div class="flex flex-col gap-1">
                <div class="flex justify-between items-center font-bold text-xs">
                    <label for="marginBottomRange" class="text-slate-600 dark:text-neutral-300">Bottom Margin</label>
                    <span id="marginBottomDisplay" class="font-mono text-skytheme-600 dark:text-orange-500 font-bold">0px</span>
                </div>
                <input type="range" id="marginBottomRange" min="0" max="200" step="5" value="0" 
                       class="w-full cursor-pointer" oninput="onMarginInput()">
            </div>

            <!-- Zoom / Scale Slider -->
            <div class="flex flex-col gap-1 col-span-2 md:col-span-1">
                <div class="flex justify-between items-center font-bold text-xs">
                    <label for="zoomRange" class="text-slate-600 dark:text-neutral-300">Viewport Scale</label>
                    <span id="zoomDisplay" class="font-mono text-skytheme-600 dark:text-orange-500 font-bold">100%</span>
                </div>
                <input type="range" id="zoomRange" min="50" max="150" step="5" value="100" 
                       class="w-full cursor-pointer" oninput="onZoomInput()">
            </div>

        </div>
    </section>

    <main id="mainContainer" class="flex-1 w-full flex flex-col items-center justify-center bg-skytheme-50 dark:bg-black p-0 m-0 overflow-hidden relative transition-colors">
        
        <!-- Interactive Game Viewport -->
        <div id="gameViewport" class="game-viewport my-0 bg-black rounded-none overflow-hidden flex items-center justify-center relative w-full h-full">
            
            <!-- Interactive Drag Handles for Edges & Corners -->
            <div class="drag-handle handle-top" data-handle="top"></div>
            <div class="drag-handle handle-bottom" data-handle="bottom"></div>
            <div class="drag-handle handle-left" data-handle="left"></div>
            <div class="drag-handle handle-right" data-handle="right"></div>
            <div class="drag-handle handle-corner-br" data-handle="corner"></div>

            <!-- Embedded Game Frame -->
            <iframe 
                id="gameIFrame" 
                src="https://itch.io/embed-upload/16918919?color=ff6600" 
                class="w-full h-full border-0 outline-none block"
                allowfullscreen="true" 
                webkitallowfullscreen="true" 
                mozallowfullscreen="true">
            </iframe>
        </div>

    </main>

    <script>
        // DOM Element Selection
        const viewport = document.getElementById('gameViewport');
        const iframe = document.getElementById('gameIFrame');
        const mainContainer = document.getElementById('mainContainer');
        const widthRange = document.getElementById('widthRange');
        const heightRange = document.getElementById('heightRange');
        const marginTopRange = document.getElementById('marginTopRange');
        const marginBottomRange = document.getElementById('marginBottomRange');
        const zoomRange = document.getElementById('zoomRange');

        const widthDisplay = document.getElementById('widthDisplay');
        const heightDisplay = document.getElementById('heightDisplay');
        const marginTopDisplay = document.getElementById('marginTopDisplay');
        const marginBottomDisplay = document.getElementById('marginBottomDisplay');
        const zoomDisplay = document.getElementById('zoomDisplay');

        const sunIcon = document.getElementById('sunIcon');
        const moonIcon = document.getElementById('moonIcon');

        // Internal Viewport State Variables
        let isFullEdgeMode = true;
        let activePreset = '100%';

        // Dragging State
        let isDragging = false;
        let activeHandle = null;
        let startX = 0;
        let startY = 0;
        let startW = 0;
        let startH = 0;

        // Theme Toggle Logic
        function toggleTheme() {
            const htmlTag = document.documentElement;
            if (htmlTag.classList.contains('dark')) {
                // Switch to Light Mode
                htmlTag.classList.remove('dark');
                sunIcon.classList.remove('hidden');
                moonIcon.classList.add('hidden');
            } else {
                // Switch to Pitch Black Dark Mode
                htmlTag.classList.add('dark');
                sunIcon.classList.add('hidden');
                moonIcon.classList.remove('hidden');
            }
        }

        // Highlight selected preset badge
        function setActivePresetBadge(presetName) {
            activePreset = presetName;
            document.querySelectorAll('.preset-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            if (presetName) {
                const targetBtn = document.getElementById(`preset-${presetName}`);
                if (targetBtn) targetBtn.classList.add('active');
            }
        }

        // Set Default "100% Full Edge" Layout
        function setFullEdgeToEdge() {
            isFullEdgeMode = true;
            setActivePresetBadge('100%');

            // Apply 100% Full Edge Dimensions
            viewport.style.width = '100%';
            viewport.style.maxWidth = '100%';
            viewport.style.height = '100%';
            viewport.style.borderRadius = '0px';

            const containerW = mainContainer.clientWidth;
            const containerH = mainContainer.clientHeight;

            widthDisplay.textContent = '100%';
            heightDisplay.textContent = '100%';

            widthRange.value = containerW;
            heightRange.value = containerH;
        }

        // Apply dynamic aspect ratio presets
        function setPreset(aspect) {
            if (aspect === '100%') {
                setFullEdgeToEdge();
                return;
            }

            isFullEdgeMode = false;
            setActivePresetBadge(aspect);
            viewport.style.borderRadius = '0.75rem'; // Rounded corners when scaled down

            const containerWidth = mainContainer.clientWidth;
            const containerHeight = mainContainer.clientHeight;
            let targetW, targetH;

            if (aspect === '16:9') {
                targetW = Math.min(containerWidth - 32, 1600);
                targetH = Math.round(targetW * (9 / 16));
            } else if (aspect === '21:9') {
                targetW = Math.min(containerWidth - 32, 1800);
                targetH = Math.round(targetW * (9 / 21));
            } else if (aspect === '4:3') {
                targetW = Math.min(containerWidth - 32, 1200);
                targetH = Math.round(targetW * (3 / 4));
            } else if (aspect === '9:16') {
                targetH = Math.min(containerHeight - 40, 800);
                targetW = Math.round(targetH * (9 / 16));
            } else if (aspect === '1:1') {
                targetH = Math.min(containerHeight - 40, 750);
                targetW = targetH;
            }

            applyDimensions(targetW, targetH);
        }

        // Apply pixel dimensions directly to the viewport
        function applyDimensions(w, h) {
            isFullEdgeMode = false;
            viewport.style.width = `${w}px`;
            viewport.style.maxWidth = '100%';
            viewport.style.height = `${h}px`;
            viewport.style.borderRadius = '0.75rem';

            widthDisplay.textContent = `${w}px`;
            heightDisplay.textContent = `${h}px`;

            widthRange.value = w;
            heightRange.value = h;
        }

        // Slider Input Callbacks
        function onSliderInput() {
            setActivePresetBadge(null);
            const w = parseInt(widthRange.value, 10);
            const h = parseInt(heightRange.value, 10);
            applyDimensions(w, h);
        }

        function onMarginInput() {
            const topM = marginTopRange.value;
            const botM = marginBottomRange.value;

            viewport.style.marginTop = `${topM}px`;
            viewport.style.marginBottom = `${botM}px`;

            marginTopDisplay.textContent = `${topM}px`;
            marginBottomDisplay.textContent = `${botM}px`;
        }

        function onZoomInput() {
            const zoomVal = zoomRange.value;
            viewport.style.transform = `scale(${zoomVal / 100})`;
            zoomDisplay.textContent = `${zoomVal}%`;
        }

        // Fullscreen Mode
        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                if (viewport.requestFullscreen) {
                    viewport.requestFullscreen();
                } else if (viewport.webkitRequestFullscreen) {
                    viewport.webkitRequestFullscreen();
                }
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
            }
        }

        // Setup Drag Event Listeners
        document.querySelectorAll('.drag-handle').forEach(handle => {
            handle.addEventListener('mousedown', startDrag);
            handle.addEventListener('touchstart', startDrag, { passive: false });
        });

        function startDrag(e) {
            e.preventDefault();
            isDragging = true;
            activeHandle = e.target.dataset.handle;
            e.target.classList.add('dragging');

            iframe.classList.add('disable-pointer');

            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;

            startX = clientX;
            startY = clientY;
            startW = viewport.offsetWidth;
            startH = viewport.offsetHeight;

            isFullEdgeMode = false;
            setActivePresetBadge(null);

            window.addEventListener('mousemove', onDrag);
            window.addEventListener('touchmove', onDrag, { passive: false });
            window.addEventListener('mouseup', stopDrag);
            window.addEventListener('touchend', stopDrag);
        }

        function onDrag(e) {
            if (!isDragging) return;
            if (e.preventDefault) e.preventDefault();

            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;

            const deltaX = clientX - startX;
            const deltaY = clientY - startY;

            let newW = startW;
            let newH = startH;

            if (activeHandle === 'right') {
                newW = startW + deltaX * 2;
            } else if (activeHandle === 'left') {
                newW = startW - deltaX * 2;
            } else if (activeHandle === 'bottom') {
                newH = startH + deltaY;
            } else if (activeHandle === 'top') {
                newH = startH - deltaY;
            } else if (activeHandle === 'corner') {
                newW = startW + deltaX;
                newH = startH + deltaY;
            }

            // Enforce bounds
            newW = Math.max(320, Math.min(newW, window.innerWidth - 20));
            newH = Math.max(250, Math.min(newH, window.innerHeight));

            applyDimensions(Math.round(newW), Math.round(newH));
        }

        function stopDrag() {
            if (!isDragging) return;
            isDragging = false;
            
            document.querySelectorAll('.drag-handle').forEach(h => h.classList.remove('dragging'));
            iframe.classList.remove('disable-pointer');

            window.removeEventListener('mousemove', onDrag);
            window.removeEventListener('touchmove', onDrag);
            window.removeEventListener('mouseup', stopDrag);
            window.removeEventListener('touchend', stopDrag);
        }

        // On window load initialization: Automatically load with Full Edge default
        window.addEventListener('DOMContentLoaded', () => {
            setFullEdgeToEdge();
            onMarginInput();
        });

        window.addEventListener('resize', () => {
            if (isFullEdgeMode) {
                setFullEdgeToEdge();
            }
        });
    </script>
</body>
</html>
